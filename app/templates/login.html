{% extends "base.html" %}
{% block content %}
<div class="miran-auth-container">
  <h2>Вход в аккаунт</h2>
  <form action="/login" method="post">
    <label>Email</label>
    <input type="email" name="email" required>

    <label>Пароль</label>
    <input type="password" name="password" required>

    <button type="submit" class="miran-btn miran-btn-primary">Войти</button>
  </form>
  <p class="miran-form-footer">Нет аккаунта? <a href="/register">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
